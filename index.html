<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rumblesheet.JS</title>

    <!-- Stylesheets -->
    <link rel="stylesheet" href="assets/styles/style.css" />
    <link rel="stylesheet" href="assets/styles/variables.css" />
    <link rel="stylesheet" href="assets/styles/ribbon.css" />
    <link rel="stylesheet" href="assets/styles/icons.css" />
    <link rel="stylesheet" href="assets/styles/main-container.css" />
    <link rel="stylesheet" href="assets/styles/rumblesheet-wrapper.css" />
  </head>

  <body>
    <div id="rumblesheet" class="rumblesheet"></div>

    <script type="module">
      try {
        const { Rumblesheet } = await import("./dist/core/rumblesheet.js");
        new Rumblesheet("rumblesheet");
      } catch (error) {
        console.error("Failed to load Rumblesheet:", error);
      }
    </script>
  </body>
</html>
